<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA-Diffusion · SiT-S/2</title>
{{STYLE}}
<style>
.wrap{max-width:1560px;padding-top:22px}.top{margin-bottom:16px}
.metersTop{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:16px}
.metersTop>div{background:#0c121b;padding:10px 17px}.metersTop b{display:block;font:650 clamp(16px,2.1vw,27px) ui-monospace,monospace;margin-top:3px}
.firstRow{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);gap:17px;margin-bottom:18px;align-items:stretch}
.firstRow>*{min-width:0}.firstRow .panelHead{padding:13px 18px}.firstRow .panelTitle{font-size:20px}
#liveGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:485px;margin:auto;padding:10px;width:100%}
.pic{position:relative;padding:0;background:#09101a;color:#fff;border:1px solid #253345;border-radius:7px;overflow:hidden;cursor:zoom-in;min-width:0}
.pic img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.pic span{position:absolute;left:4px;bottom:4px;padding:2px 5px;font:11px ui-monospace,monospace;border-radius:4px;background:#070c14d9}
.plotbox{padding:0 13px 8px}.plotbox svg{width:100%;display:block;height:auto;overflow:visible}.plotbox text{font:12px ui-monospace,monospace;fill:#a5b6cd}
.keys{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:#c6d0df;padding:10px 18px 2px;font-size:13px}.keys b{font-family:ui-monospace,monospace}
.keys i{display:inline-block;width:13px;height:3px;margin-right:5px;vertical-align:middle}
.betaHead{border-top:1px solid var(--line);padding:10px 18px 0;font-size:16px;font-weight:750}
.statusMsg{font-size:13px;color:var(--muted);padding:0 18px 8px}
#samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px}.condition{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.condition h3{font:650 13px ui-monospace,monospace;margin:0;padding:8px 10px}.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
#samples:has(.empty),#liveGrid:has(.empty){display:block}
@media(max-width:900px){.firstRow{grid-template-columns:1fr}#liveGrid{grid-template-columns:repeat(4,1fr);max-width:none}#samples{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:590px){.metersTop{grid-template-columns:1fr 1fr}.firstRow .panelHead{align-items:flex-start}#samples{grid-template-columns:1fr}.keys{gap:8px}}
</style></head><body><main class="wrap">
{{HEADER}}
<section class="metersTop" aria-label="학습 지표">
<div><span class="label">현재 학습</span><b id="step">—</b></div>
<div><span class="label">Total loss</span><b id="loss">—</b></div>
<div><span class="label">Data MSE</span><b id="mse">—</b></div>
<div><span class="label">KL rate · 전체</span><b id="totalKl">—</b></div></section>
<section class="firstRow">
<article class="panel"><div class="panelHead"><div class="panelTitle">실제 학습 배치</div><span id="liveStep" class="small mono"></span></div><div id="liveGrid"></div></article>
<article class="panel"><div class="panelHead"><div class="panelTitle">계층별 KL</div><span class="small mono">nats / data dim</span></div>
<div class="keys" id="klKeys"></div><div class="plotbox" id="klPlot"></div><div id="klText" class="statusMsg"></div>
<div class="betaHead">KL 가중치 β <span id="beta" class="mono"></span></div><div class="keys"><span>실선 · 적용값</span><span>점선 · 예정값</span></div>
<div class="plotbox" id="betaPlot"></div><div id="betaText" class="statusMsg"></div></article></section>
<section class="panel samplesPanel"><div class="panelHead"><div><div class="panelTitle">생성 샘플</div><div id="sampleMeta" class="small mono"></div></div><div id="sampleTools" class="sampleTools"></div></div><div id="samples"></div></section>
{{SAVES}}
<section class="grid"><article class="panel"><div class="panelHead"><div class="panelTitle">Loss history</div><span id="lossRange" class="small mono"></span></div><canvas id="chart"></canvas></article>
<aside class="panel"><div class="panelHead"><div class="panelTitle">학습 환경</div><span class="small mono">GPU 1</span></div><div id="cpuList" class="cpuList"></div><div id="gpuList" class="gpuList"></div>
<div class="method"><div class="methodRow"><b>최근 저장</b><span id="lastCheckpoint"></span></div><div class="methodRow"><b>다음 저장</b><span id="nextCheckpoint"></span></div></div></aside></section>
<section class="panel gpuHistoryPanel"><div class="panelHead"><div class="panelTitle">GPU 사용률</div><span class="small mono">최근 10분</span></div><canvas id="gpuHistoryChart"></canvas></section>
</main>{{LIGHTBOX}}<script src="/prx.js"></script><script src="/view.js"></script></body></html>
